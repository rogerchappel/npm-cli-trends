name: Refresh snapshot

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Prepare persistent review branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REVIEW_BRANCH: automation/refresh-snapshot
        run: |
          cp scripts/refresh-branch.mjs "$RUNNER_TEMP/refresh-branch.mjs"
          node "$RUNNER_TEMP/refresh-branch.mjs" prepare

      - name: Refresh public npm metadata
        run: npm run fetch

      - name: Verify generated artifacts
        run: npm run release:check

      - name: Verify refreshed snapshot freshness
        run: npm run validate:freshness

      - name: Publish review branch
        env:
          REVIEW_BRANCH: automation/refresh-snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs reports
          if git diff --cached --quiet; then
            echo "No snapshot changes to publish."
          else
            git commit -m "data: refresh npm CLI trends snapshot"
          fi
          node "$RUNNER_TEMP/refresh-branch.mjs" publish

      - name: Reconcile persistent review pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REVIEW_BRANCH: automation/refresh-snapshot
        run: node scripts/ensure-refresh-pr.mjs
